name: TransitETAApp
options:
  bundleIdPrefix: local.transit-eta
targets:
  TransitETAApp:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - TransitETAApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.transit-eta.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "YES"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated-Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Transit ETA
  TransitETAAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - TransitETAAppTests
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: TransitETAApp
schemes:
  TransitETAApp:
    build:
      targets:
        TransitETAApp: all
        TransitETAAppTests: [test]
    test:
      targets:
        - TransitETAAppTests
    run:
      config: Debug
